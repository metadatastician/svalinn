# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
#
# Publish the svalinn gateway image to GHCR so the
# ghcr.io/hyperpolymath/svalinn package links back to this repo via the
# org.opencontainers.image.source label injected by metadata-action.
name: Publish Image
on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'tools/mvp/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/hyperpolymath/svalinn
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest container provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/hyperpolymath/svalinn
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
