name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  scan:
    # The reusable's gitleaks job requests pull-requests: write (PR summary
    # comment) and actions: read (workflow-run metadata) at job level; the
    # caller must grant at least that or the run startup-fails.
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
