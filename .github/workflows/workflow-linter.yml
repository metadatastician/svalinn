# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'
permissions: read-all
jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check SPDX headers
        run: |
          # SPDX must appear in the LEADING COMMENT BLOCK -- the run of '#' lines
          # at the top of the file -- NOT strictly on line 1. The old test was
          # `head -1 | grep SPDX`, which is unsatisfiable in this estate: every
          # `gh actions-lock` run PREPENDS its own banner above line 1, so 16 of
          # 19 workflows failed a licence gate they all actually satisfied.
          # The gate still fails when SPDX is absent, which the control below proves.
          spdx_in_header() {
            awk '/^#/{print; next} {exit}' "$1" | grep -q "SPDX-License-Identifier"
          }

          # POSITIVE CONTROL: a headerless fixture MUST trip the check. If this
          # stops firing the gate has gone vacuous and says so, loudly.
          ctl="$(mktemp -d)/headerless.yml"
          printf 'name: no-licence-here\non: push\n' > "$ctl"
          if spdx_in_header "$ctl"; then
            echo "::error::SPDX check is VACUOUS -- it passed a file with no SPDX header."
            exit 1
          fi
          echo "Control OK: headerless fixture correctly rejected."

          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! spdx_in_header "$f"; then
              echo "ERROR: $f has no SPDX-License-Identifier in its header comment block"
              errors=$((errors + 1))
            fi
          done
          echo "Checked $(ls .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | wc -l) workflow file(s); $errors missing SPDX."
          exit $errors
      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      - name: Check pinned actions
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            # Look for uses: without SHA
            if grep -E "uses:.*@v[0-9]" "$f" | grep -v "#"; then
              echo "WARNING: $f has unpinned actions (missing SHA comment)"
            fi
          done
