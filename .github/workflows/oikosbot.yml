# SPDX-License-Identifier: MPL-2.0
name: OikosBot Sustainability Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  oikosbot:
    name: Sustainability Analysis
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hyperpolymath/oikos:v2.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OikosBot analysis
        run: |
          oikosbot report /github/workspace \
            --format sarif \
            --output /github/workspace/results.sarif \
            --config /github/workspace/.oikos.yml \
            --eco-threshold 50 || echo "OikosBot analysis completed"

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: /github/workspace/results.sarif
          category: oikosbot
