name: Surface Contract Lint
on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` are required: the label check hard-fails, so adding
    # the `surface-change` label must be able to re-trigger this run.
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  surface-contract-lint:
    name: Check Surface Changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Enforce surface contract
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --no-tags --depth=1 origin main
          git rev-parse --verify --quiet FETCH_HEAD > /dev/null
          git update-ref refs/remotes/origin/main "$(git rev-parse FETCH_HEAD)"
          ./.github/scripts/surface-contract-lint.sh | tee surface-contract.log
      - name: Report
        if: always()
        run: |
          {
            echo "## Surface Contract Check"
            echo ""
            echo '```'
            if [ -f surface-contract.log ]; then cat surface-contract.log; else echo "(the gate produced no log; see the step above)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
permissions:
  actions: read
  contents: read
