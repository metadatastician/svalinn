name: Surface Contract Lint
on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` are required: the label check hard-fails, so adding
    # the `surface-change` label must be able to re-trigger this run.
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  surface-contract-lint:
    name: Check Surface Changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Enforce surface contract
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # `tee` is the LAST command in the pipeline below, so without pipefail
          # the step would report tee's exit 0 and swallow a real failure --
          # the precise fake-green this workflow exists to remove.
          set -o pipefail
          # `fetch-depth: 0` above already provides a full-history origin/main.
          # Fetch ONLY if it is absent, and NEVER with --depth: a shallow fetch
          # writes .git/shallow, after which `origin/main...HEAD` has no merge
          # base, the file list comes back empty, and the empty-operand guard
          # below would fail an innocent PR. Verified locally, 2026-09-08.
          git rev-parse --verify --quiet origin/main > /dev/null \
            || git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          ./.github/scripts/surface-contract-lint.sh | tee surface-contract.log
      - name: Report
        if: always()
        run: |
          {
            echo "## Surface Contract Check"
            echo ""
            echo '```'
            if [ -f surface-contract.log ]; then cat surface-contract.log; else echo "(the gate produced no log; see the step above)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
permissions:
  actions: read
  contents: read
